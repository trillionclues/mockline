services:
  db:
    image: postgres:15-alpine
    container_name: mockline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mockline-network

  cache:
    image: redis:7-alpine
    container_name: mockline-cache
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mockline-network

  proxy:
    image: traefik:v3
    container_name: mockline-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - ./letsencrypt:/letsencrypt
      # Access log — shared with the API container for ingestion
      - traefik-logs:/var/log/traefik
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    networks:
      - mockline-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mockline-api
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read Traefik access logs for analytics ingestion
      - traefik-logs:/var/log/traefik:ro
    group_add:
      - "988"
    env_file: .env
    # Explicit values override .env — uses Docker service names for container networking
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.mockline.xyz`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt-wildcard"
      - "traefik.http.routers.api.tls.domains[0].main=mockline.xyz"
      - "traefik.http.routers.api.tls.domains[0].sans=*.mockline.xyz"
      - "traefik.http.services.api.loadbalancer.server.port=4000"
    networks:
      - mockline-network

networks:
  mockline-network:
    name: mockline-network
    driver: bridge

volumes:
  pgdata:
  redisdata:
  traefik-logs:
