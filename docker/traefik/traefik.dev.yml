# Traefik Static Configuration
api:
  dashboard: true
  insecure: true  # Dashboard on :8080 (dev only)

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # ignore db and cache services unless label explicitly added
    # only route containers with traefik.enable=true label
    exposedByDefault: false
    network: mockline-network

log:
  level: INFO

# Access logs — JSON format, written to a file the API can tail and ingest.
# In dev this goes to /var/log/traefik/access.log inside the Traefik container,
# which is bind-mounted to ./logs/traefik/access.log on the host.
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep
