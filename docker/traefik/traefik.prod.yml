global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: mockline-network
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  # HTTP challenge — named subdomains
  letsencrypt:
    acme:
      email: admin@mockline.xyz
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

  # DNS challenge via Cloudflare — required for *.mockline.xyz wildcard
  letsencrypt-wildcard:
    acme:
      email: admin@mockline.xyz
      storage: /letsencrypt/acme-wildcard.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

api:
  dashboard: false

# Access logs — JSON format, written to a file the API can tail and ingest.
# Bind-mounted from /opt/mockline/logs/traefik/access.log on the host.
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep
