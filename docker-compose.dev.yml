# Local dev overrides — exposes DB/Redis ports and uses dev Traefik config
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  db:
    ports:
      - "5432:5432"

  cache:
    ports:
      - "6379:6379"

  proxy:
    ports:
      - "8080:8080"
    volumes:
      - ./docker/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - traefik-logs:/var/log/traefik

volumes:
  traefik-logs:
